# omnisense/omnishield with every gateway package:
#
#   cp .env.dist .env                                          # the keys you have; none is needed
#   docker compose run --rm omnishield gateways                 # which gateways are installed and configured, what each answers
#   docker compose run --rm omnishield widget turnstile --action contact
#   docker compose run --rm omnishield solve altcha             # an ALTCHA challenge issued and solved here: a token to verify
#   docker compose run --rm omnishield verify turnstile XXXX.DUMMY.TOKEN.XXXX --ip 192.0.2.10
#   docker compose run --rm omnishield classify akismet "Buy now" --author akismet-guaranteed-spam --ip 192.0.2.10
#   docker compose run --rm omnishield lookup stopforumspam --ip 185.220.101.1
#   docker compose run --rm omnishield lookup disposable --email someone@mailinator.com
#   docker compose run --rm omnishield bare                     # plain PHP: no bundle, no container, recorded answers, and what PHP loaded
#   docker compose run --rm omnishield bare --live              # the same against the providers, with their testing keys
#   docker compose run --rm omnishield test                     # every package's tests
#
# Gateways come from GitHub (branch 1.x) unless their checkout sits under
# OMNISHIELD_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omnishield-harness

services:
  omnishield:
    build: .
    image: omnisense/omnishield-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnishield/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnishield/core
      - ${OMNISHIELD_PLUGINS:-./plugins}:/omnishield/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
